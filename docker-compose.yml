services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asg
      POSTGRES_PASSWORD: asg
      POSTGRES_DB: asg
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asg -d asg"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
